<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>P150 Compost Check</title>
<style>
/* Two choices, stacked for a phone. Palette follows the scoring pages. */
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1f1c; --muted: #5d625a; --line: #d9d8d0;
  --accent: #2f5d3a; --accent-ink: #ffffff;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151714; --panel: #1f221e; --ink: #ecede8; --muted: #a3a89f; --line: #353a33;
    --accent: #6fb384; --accent-ink: #0f1a12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151714; --panel: #1f221e; --ink: #ecede8; --muted: #a3a89f; --line: #353a33;
  --accent: #6fb384; --accent-ink: #0f1a12; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans);
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
main { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
h1 { margin: 0 0 4px; font-size: 22px; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
a.choice { display: grid; gap: 4px; padding: 16px; border-radius: 10px; text-decoration: none;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
a.choice strong { font-size: 18px; color: var(--accent); }
a.choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>P150 Compost Check</h1>
  <p>Everything you enter goes straight to the study's database.</p>
  <a class="choice" href="simple/">
    <strong>Quick score</strong>
    <span>Score a chamber (squeeze test and smell) or record a feed.</span>
  </a>
  <a class="choice" href="score/">
    <strong>Full compost check</strong>
    <span>Scores with photos, feeds, water, unloads, service, and the machine's live status.</span>
  </a>
</main>
</body>
</html>
